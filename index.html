<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>CAT.EXE — a tiny cat. a long night. one more run.</title>
<meta name="description" content="CAT.EXE is a tiny open-source pixel-art endless runner. A little black cat, a quiet city at night, one more run.">
<meta name="theme-color" content="#08090D">
<meta property="og:title" content="CAT.EXE"><meta property="og:description" content="A tiny cat. A long night. One more run.">

<div class="cx-w">
<canvas class="cx-c" width="320" height="180" role="img" aria-label="CAT.EXE: a little black cat runs across night rooftops. Press space, up arrow or W, or tap, to jump over chimneys, vents and water tanks. Collect stars and fish."></canvas>
<button id="pz" hidden aria-label="Pause">II</button>
<div id="ov" class="cx-ov"></div>
<div id="tt" role="status"></div>
